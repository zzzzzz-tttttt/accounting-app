    - data:
        code: "import json\n\ndef main(transactions_json: str, start_date: str, end_date: str) -> dict:\n\
          \    records = json.loads(transactions_json)\n    \n    # 按日期过滤\n    if start_date or end_date:\n\
          \        filtered = []\n        for r in records:\n            d = r.get(\"date\", \"\")\n\
          \            if start_date and d < start_date:\n                continue\n\
          \            if end_date and d > end_date:\n                continue\n            filtered.append(r)\n\
          \        records = filtered\n    \n    total_amount = sum(r[\"amount\"] for r in records)\n\
          \    total_count = len(records)\n    \n    # 按 tag 分组统计\n    tag_summary = {}\n\
          \    for r in records:\n        tag = r.get(\"tag\", r.get(\"category\", \"\
          其他\"))\n        if tag not in tag_summary:\n            tag_summary[tag] =\
          \ {\"amount\": 0, \"count\": 0}\n        tag_summary[tag][\"amount\"] += r[\"\
          amount\"]\n        tag_summary[tag][\"count\"] += 1\n    \n    # 文字统计\n \
          \   lines = [f\"共 {total_count} 笔，合计 {total_amount:.2f} 元\\n\"]\n    for\
          \ tag, data in sorted(tag_summary.items(), key=lambda x: x[1][\"amount\"\
          ], reverse=True):\n        lines.append(f\"{tag}：{data['amount']:.2f} 元（{data['count']}笔）\"\
          )\n    \n    # 图表数据\n    chart_data = [\n        {\"category\": tag, \"\
          amount\": round(data[\"amount\"], 2), \"count\": data[\"count\"]}\n       \
          \ for tag, data in sorted(tag_summary.items(), key=lambda x: x[1][\"amount\"\
          ], reverse=True)\n    ]\n    \n    return {\n        \"summary\": \"\\n\"\
          .join(lines),\n        \"chart_data\": chart_data\n    }\n"
