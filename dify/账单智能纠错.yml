        sourceType: start
        targetType: llm
      id: 1782896389515-llm
      source: '1782896389515'
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: answer
      id: llm-answer
      source: llm
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
    nodes:
    - data:
        title: 用户输入
        type: start
        variables: []
      height: 73
      id: '1782896389515'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        memory:
          query_prompt_template: '{{#sys.query#}}


            {{#sys.files#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: deepseek-ai/DeepSeek-V3
          provider: langgenius/siliconflow/siliconflow
        prompt_template:
        - role: system
          text: "你是一个账单纠错助手。用户会告诉你哪条账单记录需要修改。\n\n\
            你可以查询用户最近的账单记录，帮助用户找到对应的记录并修改分类或金额。\n\n\
            ⚠ 分类标签只能是以下之一：\n\
            支出类：餐饮、水果零食、买菜、烟酒、购物、穿搭美容、生活日用、家居家电、交通、爱车、酒店旅行、休闲娱乐、网络虚拟、运动、住房、生活服务、养娃、宠物、人情社交、发红包、学习教育、医疗保健、金融保险、转账、公益、其他\n\
            收入类：工资薪资、奖金、兼职收入、投资收益、其他收入\n\n\
            当用户说要修改某条记录时：\n\
            1. 先从对话历史或用户描述中找到对应记录的特征（金额、时间、备注）\n\
            2. 如果能明确确认是哪条记录，告诉用户你要修改的内容，并返回以下格式：\n\
               ACTION: UPDATE\n   ID: [记录id]\n   FIELD: [tag或amount]\n   VALUE: [新值]\n\
            3. 如果无法确认是哪条，向用户询问更多信息\n\n当用户只是聊天或询问时，正常回复。\n"
        selected: true
        title: LLM
        type: llm
        vision:
          enabled: false
      height: 88
      id: llm
      position:
        x: 380
        y: 282
      positionAbsolute:
